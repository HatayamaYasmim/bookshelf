<div class="mx-auto max-w-6xl p-8">
    <div class="mb-8">
        <h1 class="text-3xl font-semibold tracking-tight">
            My Bookshelf
        </h1>

        <p class="mt-2 text-sm text-muted-foreground">
            Your personal library
        </p>
        <button hlmBtn>
            Add book
        </button>
    </div>

    <div class="rounded-xl border bg-card">
        <div hlmTableContainer>
            <table hlmTable>
                <thead hlmTableHeader>
                    <tr hlmTableRow>
                        <th hlmTableHead>Title</th>
                        <th hlmTableHead>Author</th>
                        <th hlmTableHead>Status</th>
                    </tr>
                </thead>

                <tbody hlmTableBody>
                    @for (book of books; track book.id) {
                    <tr hlmTableRow>
                        <td hlmTableCell class="font-medium">
                            {{ book.title }}
                        </td>

                        <td hlmTableCell>
                            {{ book.author.name }}
                        </td>

                        <td hlmTableCell>
                            @switch (book.status) {

                            @case ('READ') {
                            <span hlmBadge class="border-green-200 bg-green-100 text-green-700
             dark:border-green-800 dark:bg-green-950 dark:text-green-300">
                                Read
                            </span>
                            }

                            @case ('READING') {
                            <span hlmBadge class="border-blue-200 bg-blue-100 text-blue-700
             dark:border-blue-800 dark:bg-blue-950 dark:text-blue-300">
                                Reading
                            </span>
                            }

                            @case ('UNREAD') {
                            <span hlmBadge class="border-zinc-200 bg-zinc-100 text-zinc-600
             dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-300">
                                Unread
                            </span>
                            }

                            }
                        </td>
                    </tr>
                    } @empty {
                    <tr hlmTableRow>
                        <td hlmTableCell colspan="3" class="h-24 text-center text-muted-foreground">
                            No books found.
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
